# Model weights pinned to a specific Hugging Face Hub commit (public repo, no token needed).
# Updating a weight: push new file to HF, then bump hf_revision and sha256.
# Downloaded by scripts/fetch_weights.py into g1_arm_abs/models/<filename>;
# nested layout is preserved (not flattened) because the voxel A* backend
# and the per-arm MLP loaders consume the subdirectory structure directly.
# Per-entry `verify_sha256: false` opts the entry out of the startup-time
# sha256 check (existence is still verified). Today voxel_config_bitmap_left
# and voxel_config_bitmap_right are the only opt-outs, because reading
# ~28 GB at every node startup adds ~30 s of latency. fetch_weights.py
# ignores this flag and always sha256s after download.
